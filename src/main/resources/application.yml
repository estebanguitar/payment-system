spring:
  application:
    name: payment-system

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

payment:
  security:
    encryption-key: "PaymentSystemEncryptionKeySecret32"

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

spring:
  application:
    name: payment-system

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

payment:
  security:
    encryption-key: ${PAYMENT_ENCRYPTION_SECRET:}
  pg:
    default-scenario: APPROVED
  outbox:
    enabled: false
    fixed-delay: 60000
    orphan-threshold: 60000
    batch-size: 50
    max-retry-count: 5
    lease-duration: 120000

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
      show-components: always
    metrics:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: payment-system
    description: "PG 연동 기반 결제 및 지갑 원장 시스템"
    version: "0.0.1-SNAPSHOT"
    encoding: "UTF-8"
    java-version: "17"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
